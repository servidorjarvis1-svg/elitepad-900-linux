# ElitePad: la pantalla es simpledrm (card0); glamor renderiza con nuestro Mesa (kmsro: simpledrm + powervr_sgx).
# Vuelta atrás: 20-elitepad-simpledrm.conf (AccelMethod none).
Section "Device"
    Identifier "simpledrm"
    Driver     "modesetting"
    Option     "kmsdev" "/dev/dri/card0"
    Option     "AccelMethod" "glamor"
EndSection
