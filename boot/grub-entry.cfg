menuentry "FRIDAY dev kernel 6.12 (Clover Trail)" {
    insmod efi_gop
    insmod efi_uga
    insmod gfxterm
    set gfxmode=auto
    set gfxpayload=keep
    terminal_output gfxterm
    echo "FRIDAY dev: cargando kernel 6.12..."
    linux /ubuntu/friday-dev/bzImage console=tty0 loglevel=7 noefi idle=poll button.lid_init_state=open sdhci_acpi.ctv_emmc=1
    echo "FRIDAY dev: cargando initramfs..."
    initrd /ubuntu/friday-dev/initramfs-elitepad.gz
    echo "FRIDAY dev: arrancando"
}
